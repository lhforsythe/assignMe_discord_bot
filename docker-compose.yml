services:
  discord_bot:
    depends_on:
      discord-mysql:
        condition: service_healthy
    build: .
    container_name: discord_bot
  discord-mysql:
    image: mysql:8.0.45-debian
    container_name: discord_mysql
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_USER: admin
      MYSQL_PASSWORD:
      MYSQL_DATABASE: user_data
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: